<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>空堂登記 | 遊戲玩家查詢</title>
    <style>
        :root {
            --bg: #0f1115;
            --sidebar-bg: #16181d;
            --card-bg: #1c1f26;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #2d333b;
            
            /* 狀態顏色 */
            --green: #238636;
            --green-bg: rgba(35, 134, 54, 0.25);
            --red: #da3633;
            --red-bg: rgba(218, 54, 51, 0.25);
            --yellow: #d29922;
            --yellow-bg: rgba(210, 153, 34, 0.25);
            
            --active-border: #ffffff;
            --info-bg: rgba(88, 101, 242, 0.15);
            --info-border: rgba(88, 101, 242, 0.5);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

        .sidebar { width: 340px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 30px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; overflow-y: auto; }
        .sidebar h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
        .user-info { font-size: 15px; color: var(--text-sub); padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .user-info span { color: var(--text-main); font-weight: 600; font-size: 16px; }

        /* 說明卡片 (支援摺疊) */
        .guide-card {
            background-color: var(--info-bg);
            border: 1px solid var(--info-border);
            border-radius: 8px;
            padding: 18px;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-main);
        }
        
        /* 摺疊標題 */
        .guide-summary {
            font-size: 15px;
            color: #8b9df9;
            font-weight: 600;
            cursor: pointer;
            list-style: none; 
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .guide-summary::-webkit-details-marker { display: none; }
        .guide-summary::after { content: '▼'; font-size: 10px; transition: transform 0.2s; }
        details[open] .guide-summary::after { transform: rotate(180deg); }

        .guide-content { padding-top: 12px; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
        
        .guide-card p { color: var(--text-sub); margin-bottom: 12px; }
        .guide-card ul { list-style: none; padding-left: 0; color: var(--text-sub); margin-bottom: 15px; }
        .guide-card li { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
        .guide-card li span { flex: 1; }
        .star-group { display: flex; flex-shrink: 0; margin-top: 2px; }
        .star-icon { width: 14px; height: 14px; fill: var(--yellow); }
        
        .instruction-title { font-size: 13px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
        
        /* 畫筆區 */
        .palette { display: flex; flex-direction: column; gap: 10px; }
        .brush-btn { 
            display: flex; align-items: center; gap: 12px; 
            background-color: var(--bg); border: 1px solid var(--border); 
            padding: 12px 15px; border-radius: 8px; cursor: pointer; 
            transition: all 0.2s; font-size: 15px; font-weight: 500; color: var(--text-main);
            user-select: none;
        }
        .brush-btn:hover { border-color: var(--text-sub); }
        .brush-btn.active { border-color: var(--active-border); box-shadow: 0 0 10px rgba(255,255,255,0.1); background-color: var(--card-bg); }
        .brush-btn.active[data-brush="free"] { border-color: var(--green); background-color: var(--green-bg); }
        .brush-btn.active[data-brush="busy"] { border-color: var(--red); background-color: var(--red-bg); }
        .brush-btn.active[data-brush="maybe"] { border-color: var(--yellow); background-color: var(--yellow-bg); }
        
        .brush-icon { width: 20px; height: 20px; display: flex; justify-content: center; align-items: center; }
        .brush-icon svg { width: 100%; height: 100%; }
        .brush-btn[data-brush="free"] .brush-icon svg { stroke: var(--green); }
        .brush-btn[data-brush="busy"] .brush-icon svg { stroke: var(--red); }
        .brush-btn[data-brush="maybe"] .brush-icon svg { stroke: var(--yellow); }
        .brush-btn[data-brush="eraser"] .brush-icon svg { stroke: var(--text-sub); }

        /* 按鈕群 */
        .btn-group { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 20px; }
        .action-btn { 
            border: none; padding: 14px; font-size: 15px; font-weight: 600; 
            border-radius: 8px; cursor: pointer; transition: all 0.3s; width: 100%;
            display: flex; justify-content: center; align-items: center;
        }
        .draft-btn { background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); }
        .draft-btn:hover { background-color: var(--border); }
        .submit-btn { background-color: #5865F2; color: white; }
        .submit-btn:hover { background-color: #4752C4; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 表格區 */
        .main-content { flex: 1; padding: 40px; display: flex; justify-content: center; overflow-x: auto; }
        .schedule-wrapper { width: 100%; max-width: 850px; background-color: var(--card-bg); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        
        .schedule-grid { display: grid; grid-template-columns: 70px repeat(7, 1fr); gap: 8px; user-select: none; }
        
        .header-cell { font-size: 14px; color: var(--text-sub); text-align: center; padding-bottom: 12px; font-weight: 600; }
        .time-cell { font-size: 13px; color: var(--text-sub); display: flex; align-items: center; justify-content: flex-end; padding-right: 15px; font-weight: 500; }
        
        .slot { 
            background-color: var(--bg); border: 1px solid var(--border); border-radius: 8px; height: 44px; 
            cursor: pointer; transition: all 0.1s; display: flex; justify-content: center; align-items: center; 
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        .slot:hover { border-color: var(--text-sub); }
        .slot svg { width: 18px; height: 18px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
        
        /* 狀態樣式 */
        .slot[data-status="free"] { background-color: var(--green-bg); border-color: var(--green); }
        .slot[data-status="free"] svg { stroke: var(--green); opacity: 1; }
        .slot[data-status="busy"] { background-color: var(--red-bg); border-color: var(--red); }
        .slot[data-status="busy"] svg { stroke: var(--red); opacity: 1; }
        .slot[data-status="maybe"] { background-color: var(--yellow-bg); border-color: var(--yellow); }
        .slot[data-status="maybe"] svg { stroke: var(--yellow); opacity: 1; }

        /* 錯誤畫面 */
        .error-screen { display: none; width: 100%; height: 100vh; justify-content: center; align-items: center; flex-direction: column; gap: 20px; }
        .error-screen h2 { color: var(--red); }

        /* ==========================================
           手機版極致優化 (正方形格子 + 摺疊說明)
           ========================================== */
        @media (max-width: 900px) {
            body { 
                flex-direction: column; 
                height: 100vh; 
                overflow: hidden; 
            }
            
            .sidebar { 
                width: 100%; 
                border-right: none; 
                border-bottom: 1px solid var(--border); 
                padding: 12px 15px; 
                flex-shrink: 0;
                gap: 12px;
            }
            
            .sidebar h1 { display: none; } 
            .user-info { 
                display: block; 
                padding-bottom: 8px; 
                font-size: 13px; 
                border-bottom: none;
            }
            .user-info span { font-size: 14px; }

            .guide-card { padding: 12px; }
            .guide-summary { font-size: 14px; }
            
            .palette { 
                flex-direction: row; 
                gap: 6px; 
            }
            .brush-btn { 
                flex: 1; 
                padding: 8px 4px; 
                font-size: 13px; 
                justify-content: center; 
                flex-direction: column; 
                gap: 2px;
            }
            .brush-icon { width: 16px; height: 16px; }
            .instruction-title { display: none; }
            
            .btn-group { 
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background-color: var(--sidebar-bg); 
                border-top: 1px solid var(--border);
                padding: 10px 15px;
                margin-top: 0;
                flex-direction: row;
                z-index: 100;
            }
            .action-btn { padding: 12px; font-size: 14px; }
            .draft-btn { flex: 1; }
            .submit-btn { flex: 1; }
            
            .main-content { 
                flex: 1; 
                padding: 10px; 
                overflow-y: auto; 
                overflow-x: hidden; 
                align-items: flex-start;
                padding-bottom: 80px; 
            }
            .schedule-wrapper { 
                padding: 10px; 
                width: 100%;
            }
            
            .schedule-grid { 
                grid-template-columns: 40px repeat(7, 1fr); 
                gap: 4px; 
            }
            .time-cell { 
                font-size: 10px; 
                padding-right: 4px; 
                justify-content: flex-end;
            }
            .header-cell { font-size: 11px; padding-bottom: 6px; }
            
            .slot { 
                height: auto; 
                aspect-ratio: 1 / 1; 
                border-radius: 4px; 
            }
            .slot svg { width: 12px; height: 12px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h1>玩家空堂登記</h1>
        <div class="user-info" id="userInfo">正在載入玩家資訊...</div>

        <!-- 手機版可摺疊的操作說明 -->
        <details class="guide-card" open>
            <summary class="guide-summary">操作說明</summary>
            <div class="guide-content">
                <p>1. 點上方四種狀態後，再點擊右側表格即可上色。</p>
                <ul>
                    <li>
                        <div class="star-group"><svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
                        <span>若想換色不用清除直接新色覆蓋。</span>
                    </li>
                    <li>
                        <div class="star-group"><svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
                        <span>若想取消上色，再次點擊該格即可。</span>
                    </li>
                    <li>
                        <div class="star-group">
                            <svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            <svg class="star-icon" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                        </div>
                        <span>可以直接按住滑鼠/手指拉一整排！</span>
                    </li>
                </ul>
                <p>橡皮擦用於強制清除未生效的殘留顏色。</p>
                <p style="margin-top: 10px; border-top: 1px solid var(--info-border); padding-top: 10px;">
                    2. 儲存進度<br>
                    未完成時請點「暫存進度」；<br>
                    確認完成後，請點「提交表單」送出。
                </p>
            </div>
        </details>

        <div>
            <div class="instruction-title">選擇畫筆</div>
            <div class="palette" id="palette">
                <div class="brush-btn active" data-brush="free">
                    <div class="brush-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg></div> 可以玩
                </div>
                <div class="brush-btn" data-brush="busy">
                    <div class="brush-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></div> 不行 / 上課
                </div>
                <div class="brush-btn" data-brush="maybe">
                    <div class="brush-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 22h20L12 2z"/></svg></div> 看情況
                </div>
                <div class="brush-btn" data-brush="eraser">
                    <div class="brush-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L21 10C21.5 10.5 21.5 11.5 21 12L13 20"/><path d="M17 13L7 3"/></svg></div> 橡皮擦
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="action-btn draft-btn" id="draftBtn">
                暫存進度
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 6px;">
                    <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                </svg>
            </button>
            <button class="action-btn submit-btn" id="submitBtn">提交表單</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="schedule-wrapper" id="scheduleWrapper">
            <div class="schedule-grid" id="grid"></div>
        </div>
        <div class="error-screen" id="errorScreen">
            <h2>無效的連結</h2>
            <p style="color: var(--text-sub);">請從 Discord 輸入 /填寫課表 獲取專屬連結。</p>
        </div>
    </main>

    <script>
        const API_URL = 'https://class-time-table.yun-chi-96-11-9.workers.dev/api/save-schedule';
        const GET_SCHEDULE_URL = 'https://class-time-table.yun-chi-96-11-9.workers.dev/api/get-schedule';
        const USER_API_URL = 'https://class-time-table.yun-chi-96-11-9.workers.dev/api/get-user';
        
        const DAYS = ['一', '二', '三', '四', '五', '六', '日'];
        const HOURS = [
            '07:00-08:00', '08:00-09:00', '09:00-10:00', '10:00-11:00', '11:00-12:00',
            '12:00-13:00', '13:00-14:00', '14:00-15:00', '15:00-16:00', '16:00-17:00',
            '17:00-18:00', '18:00-19:00', '19:00-20:00', '20:00-21:00', '21:00-22:00', '22:00-23:00'
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const gid = urlParams.get('gid');

        let currentBrush = 'free';
        let isDrawing = false;
        let lastSlotId = null; 

        const SVGS = {
            free: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/></svg>',
            busy: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
            maybe: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 22h20L12 2z"/></svg>'
        };

        document.querySelectorAll('.brush-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.brush-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentBrush = btn.dataset.brush;
            });
        });

        async function fetchUserName() {
            if (!uid) return '未知玩家';
            try {
                const res = await fetch(`${USER_API_URL}?uid=${uid}`);
                const data = await res.json();
                return data.name || '未知玩家';
            } catch (e) { return '未知玩家'; }
        }

        async function fetchSchedule() {
            if (!uid || !gid) return { slots: [], isDraft: false };
            try {
                const res = await fetch(`${GET_SCHEDULE_URL}?uid=${uid}&gid=${gid}`);
                return await res.json();
            } catch(e) { return { slots: [], isDraft: false }; }
        }

        async function init() {
            if (!uid || !gid) {
                document.getElementById('scheduleWrapper').style.display = 'none';
                document.getElementById('errorScreen').style.display = 'flex';
                return;
            }

            const username = await fetchUserName();
            document.getElementById('userInfo').innerHTML = `正在編輯：<span>${username}</span>`;

            const cloudData = await fetchSchedule();
            const localDataMap = {};
            if (cloudData.slots) {
                cloudData.slots.forEach(s => { localDataMap[`${s.day}_${s.time}`] = s.status; });
            }

            const grid = document.getElementById('grid');
            grid.innerHTML = ''; 

            const headerFragment = document.createDocumentFragment();
            headerFragment.appendChild(document.createElement('div')).className = 'header-cell';
            DAYS.forEach(d => {
                const div = document.createElement('div');
                div.className = 'header-cell';
                div.innerText = `星期${d}`;
                headerFragment.appendChild(div);
            });
            grid.appendChild(headerFragment);

            HOURS.forEach(hour => {
                const timeCell = document.createElement('div');
                timeCell.className = 'time-cell';
                timeCell.innerText = hour;
                grid.appendChild(timeCell);

                DAYS.forEach((_, dayIndex) => {
                    const dayNum = dayIndex + 1;
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.dataset.day = dayNum;
                    slot.dataset.time = hour;
                    slot.dataset.id = `${dayNum}_${hour}`; 
                    
                    const savedStatus = localDataMap[`${dayNum}_${hour}`] || 'none';
                    setSlotStatus(slot, savedStatus);

                    // 核心事件綁定：只在開始時觸發
                    slot.addEventListener('pointerdown', (e) => {
                        e.preventDefault(); 
                        isDrawing = true;
                        lastSlotId = slot.dataset.id;
                        applyBrush(slot);
                    });

                    grid.appendChild(slot);
                });
            });
        }

        function applyBrush(slot) {
            const currentStatus = slot.dataset.status;
            let newStatus = 'none';

            if (currentBrush === 'eraser') {
                newStatus = 'none';
            } else {
                newStatus = (currentStatus === currentBrush) ? 'none' : currentBrush;
            }

            setSlotStatus(slot, newStatus);
        }

        function setSlotStatus(slot, status) {
            slot.dataset.status = status;
            if (status === 'none') {
                slot.innerHTML = '';
            } else {
                slot.innerHTML = SVGS[status];
            }
        }

        // 🌟 全新精準滑動判定機制：使用 elementFromPoint 抓取座標
        window.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            
            // 取得目前手指/滑鼠座標正下方的元素
            const element = document.elementFromPoint(e.clientX, e.clientY);
            
            if (element && element.classList.contains('slot')) {
                if (lastSlotId !== element.dataset.id) {
                    lastSlotId = element.dataset.id;
                    applyBrush(element);
                }
            }
        }, { passive: true });

        window.addEventListener('pointerup', () => { isDrawing = false; lastSlotId = null; });
        window.addEventListener('pointercancel', () => { isDrawing = false; lastSlotId = null; });
        document.addEventListener('dragstart', (e) => e.preventDefault());

        function getSlotsData() {
            const slots = [];
            document.querySelectorAll('.slot').forEach(slot => {
                if (slot.dataset.status !== 'none') {
                    slots.push({
                        day: parseInt(slot.dataset.day),
                        time: slot.dataset.time,
                        status: slot.dataset.status
                    });
                }
            });
            return slots;
        }

        async function handleSave(action, btnElement) {
            const originalHTML = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerText = '處理中...';

            const slots = getSlotsData();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: uid, guildId: gid, slots, action })
                });

                if (res.ok) {
                    btnElement.innerText = action === 'draft' ? '暫存成功' : '提交成功';
                    setTimeout(() => btnElement.innerHTML = originalHTML, 2000);
                } else {
                    throw new Error();
                }
            } catch (err) {
                btnElement.innerText = '失敗，請重試';
                setTimeout(() => btnElement.innerHTML = originalHTML, 2000);
            } finally {
                btnElement.disabled = false;
            }
        }

        document.getElementById('draftBtn').addEventListener('click', (e) => handleSave('draft', e.target));
        document.getElementById('submitBtn').addEventListener('click', (e) => handleSave('submit', e.target));

        init();
    </script>
</body>
</html>
