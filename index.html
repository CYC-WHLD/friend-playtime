<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空堂登記 | 遊戲玩家查詢</title>
    <style>
        :root {
            --bg: #0f1115;
            --sidebar-bg: #16181d;
            --card-bg: #1c1f26;
            --text-main: #e2e8f0;
            --text-sub: #94a3b8;
            --border: #2d333b;
            --green: #238636;
            --green-bg: rgba(35, 134, 54, 0.2);
            --red: #da3633;
            --red-bg: rgba(218, 54, 51, 0.2);
            --yellow: #d29922;
            --yellow-bg: rgba(210, 153, 34, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

        /* 左側說明欄 */
        .sidebar { width: 300px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 30px; display: flex; flex-direction: column; gap: 20px; }
        .sidebar h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
        .user-info { font-size: 14px; color: var(--text-sub); padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        .user-info span { color: var(--text-main); font-weight: 600; }
        .instruction { font-size: 14px; line-height: 1.6; color: var(--text-sub); }
        .legend { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .box { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border); }
        .box.green { background-color: var(--green); border-color: var(--green); }
        .box.red { background-color: var(--red); border-color: var(--red); }
        .box.yellow { background-color: var(--yellow); border-color: var(--yellow); }
        
        .save-btn { margin-top: auto; background-color: var(--text-main); color: var(--bg); border: none; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 6px; cursor: pointer; transition: opacity 0.2s; }
        .save-btn:hover { opacity: 0.8; }
        .save-btn:disabled { background-color: var(--border); color: var(--text-sub); cursor: not-allowed; }

        /* 右側表格區 */
        .main-content { flex: 1; padding: 30px; overflow-x: auto; }
        .schedule-grid { display: grid; grid-template-columns: 80px repeat(7, 1fr); gap: 4px; min-width: 800px; }
        
        .header-cell { font-size: 13px; color: var(--text-sub); text-align: center; padding-bottom: 10px; font-weight: 600; }
        .time-cell { font-size: 12px; color: var(--text-sub); display: flex; align-items: center; justify-content: flex-end; padding-right: 12px; }
        
        .slot { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 4px; height: 36px; cursor: pointer; transition: all 0.15s; }
        .slot:hover { border-color: var(--text-sub); }
        
        /* 三種狀態 */
        .slot.free { background-color: var(--green-bg); border-color: var(--green); }
        .slot.busy { background-color: var(--red-bg); border-color: var(--red); }
        .slot.maybe { background-color: var(--yellow-bg); border-color: var(--yellow); }

        /* 手機版調整 */
        @media (max-width: 900px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); padding: 20px; }
            .main-content { padding: 20px 10px; }
            .save-btn { margin-top: 20px; width: 100%; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h1>玩家空堂登記</h1>
        <div class="user-info" id="userInfo">載入中...</div>
        
        <div class="instruction">
            <p>請點擊表格中的時間格子來標記你的狀態：</p>
            <div class="legend">
                <div class="legend-item"><div class="box green"></div> 點擊 1 次：可以玩</div>
                <div class="legend-item"><div class="box red"></div> 點擊 2 次：不行 / 上課</div>
                <div class="legend-item"><div class="box yellow"></div> 點擊 3 次：看情況</div>
                <div class="legend-item"><div class="box"></div> 點擊 4 次：清除狀態</div>
            </div>
        </div>

        <button class="save-btn" id="saveBtn">儲存並同步至 Discord</button>
    </aside>

    <main class="main-content">
        <div class="schedule-grid" id="grid">
            <!-- JS 自動生成 -->
        </div>
    </main>

    <script>
        // ⚠️ 請填入你的 Worker 網址
        const API_URL = 'https://class-time-table.yun-chi-96-11-9.workers.dev/api/save-schedule';
        
        const DAYS = ['星期一', '星期二', '星期三', '星期四', '星期五', '星期六', '星期日'];
        const HOURS = [
            '07:00-08:00', '08:00-09:00', '09:00-10:00', '10:00-11:00', '11:00-12:00',
            '12:00-13:00', '13:00-14:00', '14:00-15:00', '15:00-16:00', '16:00-17:00',
            '17:00-18:00', '18:00-19:00', '19:00-20:00', '20:00-21:00', '21:00-22:00', '22:00-23:00'
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        const gid = urlParams.get('gid');

        if (!uid || !gid) {
            document.getElementById('userInfo').innerText = '錯誤：無效的連結，請從 Discord 重新獲取。';
        } else {
            document.getElementById('userInfo').innerHTML = `正在編輯：<span>玩家 ${uid.slice(-4)}</span> 的課表`;
        }

        const grid = document.getElementById('grid');
        
        // 生成表頭
        grid.innerHTML += `<div class="header-cell"></div>`;
        DAYS.forEach(d => grid.innerHTML += `<div class="header-cell">${d}</div>`);

        // 生成表格 (16小時 x 7天)
        HOURS.forEach(hour => {
            grid.innerHTML += `<div class="time-cell">${hour}</div>`;
            DAYS.forEach((day, dayIndex) => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.day = dayIndex + 1; // 1~7
                slot.dataset.time = hour;
                
                // 點擊切換狀態 (灰 -> 綠 -> 紅 -> 黃 -> 灰)
                slot.addEventListener('click', () => {
                    if (slot.classList.contains('free')) {
                        slot.classList.remove('free');
                        slot.classList.add('busy');
                    } else if (slot.classList.contains('busy')) {
                        slot.classList.remove('busy');
                        slot.classList.add('maybe');
                    } else if (slot.classList.contains('maybe')) {
                        slot.classList.remove('maybe');
                    } else {
                        slot.classList.add('free');
                    }
                });

                grid.appendChild(slot);
            });
        });

        // 儲存資料
        document.getElementById('saveBtn').addEventListener('click', async (e) => {
            if (!uid || !gid) return alert('無效的連結');
            const btn = e.target;
            btn.disabled = true;
            btn.innerText = '儲存中...';

            const slots = [];
            document.querySelectorAll('.slot').forEach(slot => {
                let status = '';
                if (slot.classList.contains('free')) status = 'free';
                else if (slot.classList.contains('busy')) status = 'busy';
                else if (slot.classList.contains('maybe')) status = 'maybe';
                
                if (status) {
                    slots.push({
                        day: parseInt(slot.dataset.day),
                        time: slot.dataset.time,
                        status: status
                    });
                }
            });

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: uid, guildId: gid, slots })
                });

                if (res.ok) {
                    btn.innerText = '儲存成功，可關閉視窗';
                    btn.style.backgroundColor = 'var(--green)';
                    btn.style.color = '#fff';
                } else {
                    throw new Error('Server error');
                }
            } catch (err) {
                btn.innerText = '儲存失敗，請重試';
                btn.style.backgroundColor = 'var(--red)';
                btn.style.color = '#fff';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
